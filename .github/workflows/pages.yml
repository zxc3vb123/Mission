name: Test and publish

# Every push to main runs the headless test suite, and only publishes the site
# if it is green. Six chats commit to this branch, so a broken main must not
# reach the live game.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run every lane's tests
        run: node tools/run-tests.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # so a playtester can always say which build they were on
      - name: Stamp the build
        run: |
          printf '{"sha":"%s","short":"%s","built":"%s","subject":"%s"}\n' \
            "$GITHUB_SHA" "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%dT%H:%MZ)" \
            "$(git log -1 --pretty=%s | tr -d '"')" > build.json
          cat build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
