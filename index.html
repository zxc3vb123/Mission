<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<canvas id="view"></canvas>

<!-- The key list lives in the guidebook now (G, or the bar), generated
     from the real bindings so it cannot go stale. A static copy here went
     wrong twice: it missed half the keys, then promised a blast tool that
     is now off by default. -->

<div id="stats" class="panel">
<div>fps <span class="v" id="s_fps">0</span></div>
<div>loose pixels <span class="v" id="s_pxs">0</span></div>
<div>mass mover <span class="v" id="s_mm">0</span></div>
<div>unstable q <span class="v" id="s_ins">0</span></div>
<div>action <span class="v" id="s_act">-</span></div>
<div>material <span class="v" id="s_mat">-</span></div>
<div>depth <span class="v" id="s_depth">-</span></div>
</div>

<div id="vitals" class="panel">
<div><i id="v_energy" style="width:100%;background:#c8483c"></i></div>
<div><i id="v_breath" style="width:100%;background:#4a9fd8"></i></div>
</div>

<div id="inv" class="panel"></div>
<div id="tip"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
